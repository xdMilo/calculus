
<!DOCTYPE html><script src="../scripts/game-save-bridge.js"></script>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Ragdoll Archers</title>
  <meta name="description" content="Play Ragdoll Archers online.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HTCM48SNWJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-HTCM48SNWJ");
  </script>

  <!-- Game helper -->
  <script src="../files/ragdollarchers/game-helper.js"></script>

  <!-- Correct stylesheet -->
  <link rel="stylesheet" href="../files/ragdollarchers/styles.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    #loading-cover {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #unity-loading-bar {
      width: 300px;
      max-width: 85vw;
      text-align: center;
    }

    #unity-logo img {
      width: 180px;
      max-width: 100%;
      height: auto;
      margin-bottom: 25px;
      border-radius: 10px;
    }

    .progress-spinner-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 14px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff4747, #ff9b47);
      border-radius: 20px;
      transition: width 0.15s ease;
    }

    #loading-text {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-top: 15px;
    }

    #error-message {
      display: none;
      color: #ff6666;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <!-- Unity Game -->
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="0"></canvas>
  </div>

  <!-- Loading Screen -->
  <div id="loading-cover">
    <div id="unity-loading-bar">

      <div id="unity-logo">
        <img
          src="../files/ragdollarchers/RagdollArchers.jpg"
          alt="Ragdoll Archers"
        >
      </div>

      <div class="progress-spinner-container">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="loading-text">
        Loading Ragdoll Archers... 0%
      </div>

      <div id="error-message"></div>

    </div>
  </div>

  <script>
    "use strict";

    // Unity file directory
    const buildUrl = "../files/ragdollarchers";

    // Unity loader
    const loaderUrl = buildUrl + "/v111.loader.js";

    // Unity configuration
    const config = {
      dataUrl:
        buildUrl + "/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",

      frameworkUrl:
        buildUrl + "/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",

      codeUrl:
        buildUrl + "/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",

      streamingAssetsUrl:
        buildUrl + "/StreamingAssets",

      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1"
    };

    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loadingCover = document.getElementById("loading-cover");
    const progressBarFull = document.getElementById("unity-progress-bar-full");
    const loadingText = document.getElementById("loading-text");
    const errorMessage = document.getElementById("error-message");

    // Mobile detection
    const isMobile = /iPhone|iPad|iPod|Android/i.test(
      navigator.userAgent
    );

    if (isMobile) {
      container.className = "unity-mobile";
    }

    // Error handler
    function showError(message) {
      console.error("Unity Error:", message);

      loadingText.textContent = "Failed to load game";

      errorMessage.style.display = "block";
      errorMessage.textContent = String(message);
    }

    // Update progress
    function updateProgress(progress) {
      const percent = Math.round(progress * 100);

      progressBarFull.style.width = percent + "%";
      loadingText.textContent =
        "Loading Ragdoll Archers... " + percent + "%";
    }

    // Start Unity
    function startGame() {
      if (typeof createUnityInstance !== "function") {
        showError(
          "Unity loader did not initialize correctly. Check v111.loader.js."
        );
        return;
      }

      createUnityInstance(canvas, config, updateProgress)
        .then(function(unityInstance) {
          window.unityInstance = unityInstance;

          loadingCover.style.display = "none";

          canvas.focus();

          console.log("Ragdoll Archers loaded successfully.");
        })
        .catch(function(error) {
          showError(error);
        });
    }

    // Load Unity loader
    function loadUnity() {
      const script = document.createElement("script");

      script.src = loaderUrl;
      script.async = true;

      script.onload = startGame;

      script.onerror = function() {
        showError(
          "Unable to load Unity loader: " + loaderUrl +
          ". Check that the file exists and your server serves it."
        );
      };

      document.body.appendChild(script);
    }

    // Focus game on interaction
    document.addEventListener("pointerdown", function() {
      canvas.focus();
      window.focus();
    });

    // Handle visibility
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden && window.unityInstance) {
        canvas.focus();
      }
    });

    // Begin loading
    loadUnity();
  </script>

</body>
</html>
